name: Rebuild bookshelf

on:
  schedule:
    # GitHub Actions cron 默认 UTC，对应北京时间周一凌晨 02:00
    - cron: '0 18 * * 0'
  workflow_dispatch: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Fetch weread shelf (soft-fail; cached fallback)
        id: fetch
        continue-on-error: true
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        run: python scripts/fetch_weread.py

      - name: Note fetch failure (cached data still used)
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::weread fetch failed (likely -202 session warm-up on Actions IP). Using cached data/raw-shelf.json."

      - name: Build shelf
        run: python scripts/build_shelf.py

      - name: Validate public shelf contract
        run: python scripts/validate_shelf.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html shelf.html 404.html robots.txt sitemap.xml '划线/划线.html' data/raw-shelf.json; then
            echo "No changes, skip commit."
          else
            git add index.html shelf.html 404.html robots.txt sitemap.xml '划线/划线.html' data/raw-shelf.json
            git commit -m "chore: weekly weread shelf sync (auto)"
            git push
          fi
