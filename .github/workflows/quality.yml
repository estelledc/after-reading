name: Public shelf quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install pyyaml
      - name: Check generated page
        run: python scripts/build_shelf.py --check
      - name: Validate source and public contracts
        run: python scripts/validate_shelf.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
